<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controller test</title>
<style>
  body { font: 18px/1.4 -apple-system, sans-serif; background: #1c1a22; color: #f4ecd8; margin: 24px; }
  h1 { margin: 0 0 8px; } .big { font-size: 28px; font-weight: bold; } .ok { color: #8f8; } .bad { color: #f88; }
  pre { background: #000; padding: 12px; white-space: pre-wrap; max-height: 50vh; overflow: auto; }
</style>
</head>
<body>
<h1>🎮 Controller test</h1>
<p>Click once on this page, then press several buttons and move the sticks on your controller.</p>
<div class="big" id="state">Waiting for a button press…</div>
<pre id="log"></pre>
<script>
const log = [];
const out = document.getElementById('log');
const state = document.getElementById('state');
function add(line) {
  log.push(`${(performance.now() / 1000).toFixed(1)}s ${line}`);
  out.textContent = log.slice(-60).join('\n');
  send();
}
let sendTimer = 0;
function send() {
  clearTimeout(sendTimer);
  sendTimer = setTimeout(() => {
    fetch('http://localhost:5199/log', { method: 'POST', body: JSON.stringify({ ua: navigator.userAgent, secure: isSecureContext, log }) }).catch(() => {});
  }, 300);
}
add(`browser: ${navigator.userAgent}`);
add(`secure page: ${isSecureContext}, getGamepads available: ${typeof navigator.getGamepads}`);
addEventListener('gamepadconnected', (e) => add(`EVENT connected: "${e.gamepad.id}" mapping="${e.gamepad.mapping}" buttons=${e.gamepad.buttons.length} axes=${e.gamepad.axes.length}`));
addEventListener('gamepaddisconnected', (e) => add(`EVENT disconnected: "${e.gamepad.id}"`));
addEventListener('keydown', (e) => add(`key: ${e.code}`));
addEventListener('pointerdown', () => add('click on page'));
let last = '';
setInterval(() => {
  let pads = [];
  try { pads = [...(navigator.getGamepads?.() ?? [])].filter(Boolean); } catch (err) { add('getGamepads error: ' + err); }
  const snap = pads.map((p) => `#${p.index} "${p.id}" mapping="${p.mapping}" pressed=[${p.buttons.map((b, i) => b.pressed ? i : -1).filter((i) => i >= 0)}] axes=[${p.axes.map((a) => a.toFixed(1))}]`).join(' | ') || 'no pads';
  state.innerHTML = pads.length ? `<span class="ok">Seen: ${pads[0].id}</span>` : '<span class="bad">No controller seen yet</span>';
  if (snap !== last) { last = snap; add('poll: ' + snap); }
}, 100);
add(`page focused: ${document.hasFocus()}`);
</script>
</body>
</html>
